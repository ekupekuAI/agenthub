<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">agenthub</title>
  <desc id="d">agenthub, the package manager and trust layer for agent skills. A terminal types "agenthub install web-testing"; the package is scanned, locked with a SHA-256 digest and installed into Claude Code, Codex, Cursor and VS Code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0e"/>
      <stop offset="1" stop-color="#11151a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c5f04a"/>
      <stop offset="0.5" stop-color="#7cc4fa"/>
      <stop offset="1" stop-color="#c5f04a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c5f04a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c5f04a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="sweepClip"><rect x="0" y="210" width="500" height="16"/></clipPath>
    <clipPath id="typeClip">
      <rect class="typer" x="672" y="104" width="290" height="30"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .serif { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; font-style: italic; }

    /* Gradient underline drifts left and right. */
    .sweep { animation: sweep 8s ease-in-out infinite alternate; }
    @keyframes sweep { from { transform: translateX(-240px); } to { transform: translateX(0); } }

    .halo { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }

    /* Command typing: the clip rect grows in steps, one per character. */
    .typer { transform-box: fill-box; transform-origin: left; animation: type 1.6s steps(28, end) 0.4s both; }
    @keyframes type { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .cursor { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Output lines and package blocks appear one after another. */
    .line { animation: rise 0.45s ease-out both; }
    .l1 { animation-delay: 2.2s; } .l2 { animation-delay: 2.8s; } .l3 { animation-delay: 3.4s; }
    .l4 { animation-delay: 4.0s; } .l5 { animation-delay: 4.6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .pkg { animation: snap 0.55s cubic-bezier(.2,1.4,.4,1) both; }
    .p1 { animation-delay: 4.7s; } .p2 { animation-delay: 4.85s; } .p3 { animation-delay: 5.0s; } .p4 { animation-delay: 5.15s; }
    @keyframes snap { from { opacity: 0; transform: translateY(-34px); } to { opacity: 1; transform: none; } }


    @media (prefers-reduced-motion: reduce) {
      .sweep, .halo, .typer, .cursor, .line, .pkg { animation: none !important; }
    }
  </style>

  <rect width="1200" height="440" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="20" fill="url(#grid)"/>
  <ellipse class="halo" cx="300" cy="200" rx="320" ry="200" fill="url(#halo)"/>

  <!-- Wordmark and pitch -->
  <g transform="translate(64 0)">
    <g transform="translate(0 92)">
      <rect width="34" height="34" rx="9" fill="#c5f04a"/>
      <path d="M9 22l8-12 8 12" fill="none" stroke="#0b0c0e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="26" class="mono" font-size="22" fill="#a3abb5" letter-spacing="1">PACKAGE MANAGER · TRUST LAYER</text>
    </g>
    <text x="-4" y="196" class="sans" font-size="86" font-weight="700" fill="#eceef0" letter-spacing="-3">agenthub</text>
    <g clip-path="url(#sweepClip)">
      <rect class="sweep" x="0" y="216" width="740" height="4" rx="2" fill="url(#glow)"/>
    </g>
    <text x="0" y="268" class="sans" font-size="26" fill="#eceef0">Install agent skills you can <tspan class="serif" fill="#c5f04a" font-size="30">trust.</tspan></text>
    <text x="0" y="306" class="sans" font-size="19" fill="#a3abb5">One command for Claude Code, Codex, Cursor and VS Code.</text>
    <text x="0" y="334" class="sans" font-size="19" fill="#a3abb5">Scanned before install, pinned by SHA-256,</text>
    <text x="0" y="362" class="sans" font-size="19" fill="#a3abb5">verifiable and reversible.</text>
  </g>

  <!-- Terminal -->
  <g>
    <rect x="626" y="56" width="514" height="248" rx="14" fill="#0f1215" stroke="#262b31"/>
    <path d="M626 70a14 14 0 0 1 14-14h486a14 14 0 0 1 14 14v18H626z" fill="#16191d"/>
    <circle cx="648" cy="72" r="5.5" fill="#ff7a85"/>
    <circle cx="666" cy="72" r="5.5" fill="#f5b544"/>
    <circle cx="684" cy="72" r="5.5" fill="#c5f04a"/>
    <text x="883" y="77" text-anchor="middle" class="mono" font-size="13" fill="#808995">~/my-project</text>

    <text x="652" y="125" class="mono" font-size="17" fill="#808995">$</text>
    <g clip-path="url(#typeClip)">
      <text x="672" y="125" class="mono" font-size="17" fill="#eceef0">agenthub install web-testing</text>
    </g>
    <rect class="cursor" x="962" y="110" width="9" height="19" fill="#c5f04a"/>

    <g class="mono" font-size="15">
      <g class="line l1"><text x="652" y="162" fill="#c5f04a">✔</text><text x="676" y="162" fill="#a3abb5">scan</text><text x="776" y="162" fill="#eceef0">2 findings · all declared</text></g>
      <g class="line l2"><text x="652" y="190" fill="#c5f04a">✔</text><text x="676" y="190" fill="#a3abb5">plan</text><text x="776" y="190" fill="#eceef0">.claude/skills · .agents/skills</text></g>
      <g class="line l3"><text x="652" y="218" fill="#c5f04a">✔</text><text x="676" y="218" fill="#a3abb5">stage</text><text x="776" y="218" fill="#eceef0">atomic swap, snapshot kept</text></g>
      <g class="line l4"><text x="652" y="246" fill="#c5f04a">✔</text><text x="676" y="246" fill="#a3abb5">lock</text><text x="776" y="246" fill="#7cc4fa">sha256:e22530ce451e</text><text x="958" y="246" fill="#808995">+ file hashes</text></g>
      <g class="line l5"><text x="652" y="280" fill="#c5f04a" font-weight="700">Installed web-testing 1.3.0 into 4 agents</text></g>
    </g>
  </g>

  <!-- Agent slots with packages snapping in -->
  <g class="mono" font-size="14">
    <g transform="translate(626 330)">
      <rect width="118" height="62" rx="10" fill="none" stroke="#353b43" stroke-dasharray="4 4"/>
      <g class="pkg p1">
        <rect x="10" y="10" width="24" height="24" rx="5" fill="#c5f04a"/>
        <path d="M16 22.5l4 4 8-9" fill="none" stroke="#0b0c0e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="42" y="27" class="sans" fill="#eceef0" font-size="14" font-weight="600">Claude Code</text>
      <text x="10" y="52" fill="#808995" font-size="12">.claude/skills</text>
    </g>
    <g transform="translate(758 330)">
      <rect width="118" height="62" rx="10" fill="none" stroke="#353b43" stroke-dasharray="4 4"/>
      <g class="pkg p2">
        <rect x="10" y="10" width="24" height="24" rx="5" fill="#c5f04a"/>
        <path d="M16 22.5l4 4 8-9" fill="none" stroke="#0b0c0e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="42" y="27" class="sans" fill="#eceef0" font-size="14" font-weight="600">Codex</text>
      <text x="10" y="52" fill="#808995" font-size="12">.agents/skills</text>
    </g>
    <g transform="translate(890 330)">
      <rect width="118" height="62" rx="10" fill="none" stroke="#353b43" stroke-dasharray="4 4"/>
      <g class="pkg p3">
        <rect x="10" y="10" width="24" height="24" rx="5" fill="#c5f04a"/>
        <path d="M16 22.5l4 4 8-9" fill="none" stroke="#0b0c0e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="42" y="27" class="sans" fill="#eceef0" font-size="14" font-weight="600">Cursor</text>
      <text x="10" y="52" fill="#808995" font-size="12">reads both</text>
    </g>
    <g transform="translate(1022 330)">
      <rect width="118" height="62" rx="10" fill="none" stroke="#353b43" stroke-dasharray="4 4"/>
      <g class="pkg p4">
        <rect x="10" y="10" width="24" height="24" rx="5" fill="#c5f04a"/>
        <path d="M16 22.5l4 4 8-9" fill="none" stroke="#0b0c0e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="42" y="27" class="sans" fill="#eceef0" font-size="14" font-weight="600">VS Code</text>
      <text x="10" y="52" fill="#808995" font-size="12">reads both</text>
    </g>
  </g>
</svg>
